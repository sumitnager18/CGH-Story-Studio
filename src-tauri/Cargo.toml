[package]
name = "cgh-story-studio"
version = "0.1.0"
description = "CGH Story Studio desktop application"
authors = ["Sumit Kumar Nager"]
edition = "2021"

[lib]
name = "cgh_story_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
